name: "Enhancement Request (Feature)"
description: "Request a new feature using an Agile user-story format and acceptance criteria."
title: "[ENHANCEMENT] "
labels: [enhancement, needs-triage]
body:
  - type: input
    id: role
    attributes:
      label: "As a... (role)"
      description: "Who benefits from this feature?"
      placeholder: "e.g., As a product manager"
      required: true

  - type: input
    id: goal
    attributes:
      label: "I want... (goal)"
      description: "What is the capability you want?"
      placeholder: "e.g., I want to be able to schedule recurring tasks"
      required: true

  - type: input
    id: benefit
    attributes:
      label: "So that... (benefit)"
      description: "Why is this valuable?"
      placeholder: "e.g., So that I can automate weekly workflows"
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Acceptance criteria"
      description: "Define clear, testable conditions that must be met for this to be considered done."
      placeholder: "- Given...\n- When...\n- Then..."

  - type: input
    id: suggested-priority
    attributes:
      label: "Suggested priority"
      description: "Low / Medium / High"
      placeholder: "Medium"

  - type: textarea
    id: additional-details
    attributes:
      label: "Additional details / design notes"
      description: "Any mockups, links or extra info that help describe the enhancement."