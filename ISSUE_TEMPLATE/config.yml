# Organization issue template config
blank_issues_enabled: true
# Optional contact links (example) - update or remove as needed
contact_links:
  - name: "Support"
    url: "https://example.com/support"
    about: "For private or sensitive issues, contact support."
# Preferred presentation order for humans reviewing templates (GitHub's UI may vary)
template_order:
  - "bug_report.yml"
  - "enhancement.yml"
  - "blank.yml"