name: "Bug Report"
description: "Report a bug with reproduction steps, environment, and logs to help triage and fix it."
labels: [bug, needs-triage]
body:
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: "Steps to reproduce"
      description: "Provide a concise, numbered list of steps to reproduce the bug."
      placeholder: "1. ...\n2. ...\n3. ..."

  - type: textarea
    id: expected-behavior
    attributes:
      label: "Expected behavior"

  - type: textarea
    id: actual-behavior
    attributes:
      label: "Actual behavior"

  - type: input
    id: environment
    attributes:
      label: "Environment (HW version, FW version, SW version)"
      description: "Include any other relevant environment details."
      placeholder: "TX FrontEnd v0.1, TX Backend v0.2, FW v0.27, HW Rev. 2026-01-15"

  - type: textarea
    id: logs
    attributes:
      label: "Supporting files (logs, etc.)"
      description: "Paste any relevant logs, error messages, screenshots, videos, or stack traces."

  - type: dropdown
    id: severity
    attributes:
      label: "Severity"
      options: ["Low", "Medium", "High", "Critical"]

  - type: textarea
    id: additional-context
    attributes:
      label: "Additional context"
      description: "Anything else that may help reproduce or diagnose the issue."
